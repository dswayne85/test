[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bestcase-agent"
version = "0.1.0"
description = "Windows-only desktop automation agent for Best Case bankruptcy software using pywinauto."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Best Case Agent" }]
dependencies = [
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
    # pywinauto + pywin32 are Windows-only. The marker keeps the project
    # installable (and testable) on non-Windows machines/CI.
    "pywinauto>=0.6.8 ; sys_platform == 'win32'",
    "pywin32>=306 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
bestcase-inspect = "bestcase_agent.flows.inspect_bestcase:main"
bestcase-connect = "bestcase_agent.flows.inspect_bestcase:connect_main"

[tool.hatch.build.targets.wheel]
packages = ["src/bestcase_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
